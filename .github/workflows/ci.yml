name: maboroutu GTest verification

# =============================================================================
# サポート対象コンパイラの方針（実機検証結果を踏まえて確定）:
#   GCC 15 以上 / Clang 18 以上。
#   - GCC 13 は "deducing this" (P0847, C++23) に未対応でビルド不可
#     （実機確認済み。library_spec.md 4.1.1節の「GCC13+」という記載とは
#     異なる。要映幻確認）。
#   - GCC 14 は C++20 modules 実装が不安定
#     ("failed to read compiled module: Bad file data"、GCC Bugzilla
#     PR99426相当の既知の不具合。実機確認済み・再現条件は未特定)。
#   - GCC 15 / Clang 18 以上では、patch.txt(累積版・以後の差分版含む)を
#     適用した状態で実機ビルド・全85テストのパスを確認済み。
#   - Clang 16・17はこの方針変更に伴いCI対象から除外した
#     (個別に不具合があるわけではなく、単純にサポート対象外としたため)。
#
# その他の実機検証済みの前提:
#   - CMake 3.28 は Clang18/GCC14 いずれでも、実際にコンパイルされる
#     (INTERFACEでない) ターゲットへの target_compile_features(cxx_std_26)
#     を「不明な機能」としてConfigureエラーにする(実機確認済み)。
#     C++26のコンパイラ機能テーブルが十分に整備された、より新しい CMake
#     (本ワークフローでは 3.31 系を明示インストール) を使用する。
#   - Clang 18 + libstdc++ の組み合わせでは std::expected が見つからない
#     （<expected> がinclude済みでも同様）。Clang系ジョブでは
#     -stdlib=libc++ を明示し、libc++-dev を別途インストールする。
#   - windows-latest ランナーで `-G "Visual Studio 17 2022"` を固定指定すると
#     "could not find any instance of Visual Studio" になることを実機確認
#     済み（ランナー上の実際のVisual Studioバージョンが2022と異なるため、
#     バージョン番号をハードコードしたVSジェネレータ名では検出できない）。
#     ilammy/msvc-dev-cmd + Ninja ジェネレータへ変更し、具体的な
#     Visual Studioバージョンに依存しないようにした。
#   - MABOROUTU_SOURCE_DIR で指定したローカルチェックアウトを使う場合、
#     以下12件の実装バグ（GTestプロジェクト側で発見・提示した最小修正）が
#     適用されている前提。詳細は本リポジトリ付属のバグ報告
#     (README.md もしくは会話ログ本文) を参照。
#     1. core/src/extension_store.cppm: local_typeid::cmp<T>() の return文欠落
#     2. core/src/extension_store.cppm: value_type::size() の非static呼び出し
#     3. core/src/extension_store.cppm: transform_each が visit_each のまま
#        (かつ制約不足) で多重定義・呼び出し曖昧
#     4. core/src/extension_store.cppm: alt_t::element_type のtypename欠落
#     5. core/src/sequential_source.cppm: sequential_source_handle /
#        writable_sequential_source_handle の export欠落
#     6. CMakeLists.txt (root): WORKSPACE_NAME が ${CMAKE_PROJECT_NAME} 由来
#        になっており、他プロジェクトから add_subdirectory/FetchContent
#        されると別名になってしまう
#     7. core/src/binary_convert.cppm: std::unexpected(bytes.error()) が
#        lvalueからのコピーになってしまっている(move-only型のため必要な
#        std::move漏れ、6箇所)
#     8. core/src/sequential_view.cppm: read() の `return *result;` も同様の
#        move漏れ
#     9. extension/src/stream_data_source.cppm: 同様のmove漏れ(4箇所)
#     10. core/src/core.cppm: contains_duplicate_t の部分特殊化への
#        export重複付与(GCC15で検出)
#     11. extension/src/console.cppm: std::formatter<command_hander> の
#        完全特殊化への export重複付与(GCC15で検出)
#     12. extension/src/source_location_format.cppm: 11.と同一パターン
#   自分のフォーク・ブランチでこれらを未修正のまま本ワークフローを走らせる
#   場合、core/extension のビルドがこの時点で失敗する。
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # NOTE: MABOROUTU_GIT_REPOSITORY / MABOROUTU_GIT_TAG は vcpkg.json の
  # homepageフィールドから推測した既定値であり未検証。実際のURL・ブランチ/
  # タグに置き換えること。
  MABOROUTU_GIT_REPOSITORY: "https://github.com/Eigen-0x41/maboroutu.git"
  MABOROUTU_GIT_TAG: "develop"

jobs:
  clang:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        clang: [18, 19]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang ${{ matrix.clang }} + libc++ + Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-${{ matrix.clang }} clang-tools-${{ matrix.clang }} \
            libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev \
            ninja-build

      - name: Install a CMake new enough to know cxx_std_23 for this compiler
        run: pipx install "cmake>=3.31" --force

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=clang-${{ matrix.clang }}
          -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-${{ matrix.clang }}
          -DMABOROUTU_GIT_REPOSITORY="${{ env.MABOROUTU_GIT_REPOSITORY }}"
          -DMABOROUTU_GIT_TAG="${{ env.MABOROUTU_GIT_TAG }}"

      - name: Build
        run: cmake --build build

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  gcc:
    # サポート対象はGCC15以上（本ワークフロー冒頭のコメント参照）。
    # GCC13(deducing this未対応)・GCC14(modules実装が不安定)は対象外とした。
    # GCC15はpatch.txt(1〜12)適用後の実機検証で全85テストのパスを確認済み
    # だが、GCCのC++20 modules実装は他の入力構成でなお不安定になり得る
    # (PR99426等)ため、念のためcontinue-on-errorは維持する。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        gcc: [15, 16]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC ${{ matrix.gcc }} + Ninja
        # NOTE: ubuntu-24.04 の既定APTリポジトリには g++-13/14/15 が
        # 収録されていない(または最新パッチが無い)場合があるため、
        # ubuntu-toolchain-r/test PPA を追加してから導入する
        # (Claudeのメモリに残る過去の実機検証手順と同一)。
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-${{ matrix.gcc }} ninja-build

      - name: Install a CMake new enough to know cxx_std_23 for this compiler
        run: pipx install "cmake>=3.31" --force

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc-${{ matrix.gcc }}
          -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}
          -DMABOROUTU_GIT_REPOSITORY="${{ env.MABOROUTU_GIT_REPOSITORY }}"
          -DMABOROUTU_GIT_TAG="${{ env.MABOROUTU_GIT_TAG }}"

      - name: Build
        run: cmake --build build -j1 # GCC modules: 並列ビルドでの不安定さを避ける

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  msvc:
    # library_spec.md 4.1.1節: MSVC 19.51.36252 (Build Tools 14.51, VS2026)
    # で実機確認済みとされているバージョン。
    strategy:
      fail-fast: false
      matrix:
        env:
          - os: windows-2025
            version: "Visual Studio 18 2026"
          - os: windows-2022
            version: "Visual Studio 17 2022"
        build_type: [Debug, Release]
    runs-on: ${{ matrix.env.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G "${{ matrix.env.version }}"
          -DMABOROUTU_GIT_REPOSITORY="${{ env.MABOROUTU_GIT_REPOSITORY }}"
          -DMABOROUTU_GIT_TAG="${{ env.MABOROUTU_GIT_TAG }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
