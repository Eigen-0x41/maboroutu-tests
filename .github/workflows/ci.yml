name: maboroutu GTest verification

# =============================================================================
# サポート対象コンパイラの方針（実機検証結果を踏まえて確定）:
#   GCC 15 以上 / Clang 18 以上。
#   - GCC 13 は "deducing this" (P0847, C++23) に未対応でビルド不可
#     （実機確認済み。library_spec.md 4.1.1節の「GCC13+」という記載とは
#     異なる。要映幻確認）。
#   - GCC 14 は C++20 modules 実装が不安定
#     ("failed to read compiled module: Bad file data"、GCC Bugzilla
#     PR99426相当の既知の不具合。実機確認済み・再現条件は未特定)。
#   - GCC 15 / Clang 18 以上では、patch.txt(累積版・以後の差分版含む)を
#     適用した状態で実機ビルド・全85テストのパスを確認済み。
#   - Clang 16・17はこの方針変更に伴いCI対象から除外した
#     (個別に不具合があるわけではなく、単純にサポート対象外としたため)。
#
# その他の実機検証済みの前提:
#   - CMake 3.28 は Clang18/GCC14 いずれでも、実際にコンパイルされる
#     (INTERFACEでない) ターゲットへの target_compile_features(cxx_std_26)
#     を「不明な機能」としてConfigureエラーにする(実機確認済み)。
#     C++26のコンパイラ機能テーブルが十分に整備された、より新しい CMake
#     (本ワークフローでは 3.31 系を明示インストール) を使用する。
#   - Clang 18 + libstdc++ の組み合わせでは std::expected が見つからない
#     （<expected> がinclude済みでも同様）。Clang系ジョブでは
#     -stdlib=libc++ を明示し、libc++-dev を別途インストールする。
#   - windows-latest ランナーで `-G "Visual Studio 17 2022"` を固定指定すると
#     "could not find any instance of Visual Studio" になることを実機確認
#     済み（ランナー上の実際のVisual Studioバージョンが2022と異なるため、
#     バージョン番号をハードコードしたVSジェネレータ名では検出できない）。
#     ilammy/msvc-dev-cmd + Ninja ジェネレータへ変更し、具体的な
#     Visual Studioバージョンに依存しないようにした。
# =============================================================================
on:
   push:
      branches: [main]
   pull_request:
      branches: [main]
   workflow_dispatch:
      inputs:
         project_directory:
            description: "Test directory (all: ., error/abort, error/terminate, error/throw)"
            required: true
            type: choice
            options:
               - all
               - .
               - error/abort
               - error/terminate
               - error/throw
            default: all

         compiler:
            description: "Compiler (all: clang + msvc + sanitizer. gcc runs only when selected)"
            required: true
            type: choice
            options:
               - all
               - clang
               - gcc
               - msvc
               - sanitizer
            default: all

         build_type:
            description: "Target Build Type"
            required: true
            type: choice
            options:
               - Both
               - Debug
               - Release
            default: Both

         library_repository:
            description: "Library repository URL (default: repository variable MABOROUTU_GIT_REPOSITORY)"
            required: false
            type: string
            default: ""

         library_ref:
            description: "Library branch/tag/commit (default: repository variable MABOROUTU_GIT_TAG, or main)"
            required: false
            type: string
            default: ""

         appkit_repository:
            description: "maboroutu-appkit repository URL (default: repository variable MABOROUTU_APPKIT_GIT_REPOSITORY)"
            required: false
            type: string
            default: ""

         appkit_ref:
            description: "maboroutu-appkit branch/tag/commit (default: repository variable MABOROUTU_APPKIT_GIT_TAG, or main)"
            required: false
            type: string
            default: ""

# 同一ref上の古い実行は新しい実行で置き換える。
concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

permissions:
   contents: read

# push / pull_request では inputs が空になるため、以下の式で既定値へ
# フォールバックする（project_directory: 全て、build_type: Both）。
# GCCは手動実行（workflow_dispatch）でcompilerにgccを選んだ場合のみ実行する
# （現状は全バージョンでビルド不可のため、常時実行すると無駄な赤になる）。
jobs:
   clang:
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.compiler == 'all' || inputs.compiler == 'clang' }}
      strategy:
         fail-fast: false
         matrix:
            project_directory: ${{ fromJSON(inputs.project_directory && inputs.project_directory != 'all' && format('["{0}"]', inputs.project_directory) || '[".", "error/abort", "error/terminate", "error/throw"]') }}
      uses: ./.github/workflows/impl_clang.yml
      with:
         compiler: clang
         project_directory: ${{ matrix.project_directory }}
         build_type: ${{ inputs.build_type || 'Both' }}
         library_repository: ${{ inputs.library_repository }}
         library_ref: ${{ inputs.library_ref }}
         appkit_repository: ${{ inputs.appkit_repository }}
         appkit_ref: ${{ inputs.appkit_ref }}

   msvc:
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.compiler == 'all' || inputs.compiler == 'msvc' }}
      strategy:
         fail-fast: false
         matrix:
            project_directory: ${{ fromJSON(inputs.project_directory && inputs.project_directory != 'all' && format('["{0}"]', inputs.project_directory) || '[".", "error/abort", "error/terminate", "error/throw"]') }}
      uses: ./.github/workflows/impl_msvc.yml
      with:
         compiler: msvc
         project_directory: ${{ matrix.project_directory }}
         build_type: ${{ inputs.build_type || 'Both' }}
         library_repository: ${{ inputs.library_repository }}
         library_ref: ${{ inputs.library_ref }}
         appkit_repository: ${{ inputs.appkit_repository }}
         appkit_ref: ${{ inputs.appkit_ref }}

   # サニタイザ（ASan + UBSan）。結果は他のジョブとは別のチェックとして表示される。
   # error/* は終了経路（abort/terminate）の検証が目的のため対象外。
   sanitizer:
      if: ${{ github.event_name != 'workflow_dispatch' || inputs.compiler == 'all' || inputs.compiler == 'sanitizer' }}
      uses: ./.github/workflows/impl_sanitizer.yml
      with:
         library_repository: ${{ inputs.library_repository }}
         library_ref: ${{ inputs.library_ref }}
         appkit_repository: ${{ inputs.appkit_repository }}
         appkit_ref: ${{ inputs.appkit_ref }}

   gcc:
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.compiler == 'gcc' }}
      strategy:
         fail-fast: false
         matrix:
            project_directory: ${{ fromJSON(inputs.project_directory && inputs.project_directory != 'all' && format('["{0}"]', inputs.project_directory) || '[".", "error/abort", "error/terminate", "error/throw"]') }}
      uses: ./.github/workflows/impl_gcc.yml
      with:
         compiler: gcc
         project_directory: ${{ matrix.project_directory }}
         build_type: ${{ inputs.build_type }}
         library_repository: ${{ inputs.library_repository }}
         library_ref: ${{ inputs.library_ref }}
         appkit_repository: ${{ inputs.appkit_repository }}
         appkit_ref: ${{ inputs.appkit_ref }}
