name: maboroutu GTest verification (sanitizer)

# Clang + libc++ で ASan + UBSan を有効にして、Debugビルドの全テストを実行する。
# Debugとするのは、assertおよびデスクテストを有効にしたまま検証するため。

on:
   workflow_call:
      inputs:
         library_repository:
            required: false
            type: string
            default: ""

         library_ref:
            required: false
            type: string
            default: ""

         # 本体リポジトリ側のワークフローから呼び出す場合に指定する。
         tests_repository:
            required: false
            type: string
            default: ""

         tests_ref:
            required: false
            type: string
            default: ""

jobs:
   test:
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-24.04]
            clang: [18, 19]
      runs-on: ${{ matrix.os }}
      env:
         # NOTE: libc++abiの例外オブジェクトの確保（operator new）と解放（free）が
         #       ASanにalloc-dealloc-mismatchとして誤検知される
         #       （clang 18 + libc++ 18、Ubuntu 24.04で確認。例外を送出する
         #       テストのみが失敗し、本オプション無効化で全件合格する）。
         #       この誤検知のみを無効化し、他の検査は有効のままとする。
         ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1
         UBSAN_OPTIONS: print_stacktrace=1
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.tests_repository || github.repository }}
              ref: ${{ inputs.tests_ref }}

         - name: Install Clang ${{ matrix.clang }} + libc++ + sanitizer runtime + Ninja
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                clang-${{ matrix.clang }} clang-tools-${{ matrix.clang }} \
                libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev \
                libclang-rt-${{ matrix.clang }}-dev \
                ninja-build

         - name: Install a CMake new enough to know cxx_std_23 for this compiler
           run: pipx install "cmake>=3.31" --force

         - name: Configure
           run: >
              cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_C_COMPILER=clang-${{ matrix.clang }}
              -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
              -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fsanitize=address,undefined"
              -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-${{ matrix.clang }}
              -DMABOROUTU_GIT_REPOSITORY="${{ inputs.library_repository || vars.MABOROUTU_GIT_REPOSITORY || 'https://github.com/Eigen-0x41/maboroutu.git' }}"
              -DMABOROUTU_GIT_TAG="${{ inputs.library_ref || vars.MABOROUTU_GIT_TAG || 'main' }}"

         - name: Build
           run: cmake --build build

         - name: Test
           working-directory: build
           run: ctest --output-on-failure
