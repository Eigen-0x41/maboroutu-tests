name: maboroutu GTest verification implementation

on:
   workflow_call:
      inputs:
         compiler:
            required: true
            type: string

         project_directory:
            required: true
            type: string

         build_type:
            required: true
            type: string

         library_repository:
            required: false
            type: string
            default: ""

         library_ref:
            required: false
            type: string
            default: ""

         appkit_repository:
            required: false
            type: string
            default: ""

         appkit_ref:
            required: false
            type: string
            default: ""

         # 本体リポジトリ側のワークフローから呼び出す場合に指定する。
         # reusable workflowの actions/checkout は既定で呼び出し元
         # （本体リポジトリ）を取得するため、テスト側を明示する。
         tests_repository:
            required: false
            type: string
            default: ""

         tests_ref:
            required: false
            type: string
            default: ""

jobs:
   test:
      # library_spec.md 4.1.1節: MSVC 19.51.36252 (Build Tools 14.51, VS2026)
      # で実機確認済みとされているバージョン。
      strategy:
         fail-fast: false
         matrix:
            env:
               - os: windows-2025
                 version: "Visual Studio 18 2026"
               - os: windows-2022
                 version: "Visual Studio 17 2022"
            build_type: ${{ fromJSON(inputs.build_type == 'Both' && '["Debug", "Release"]' || format('["{0}"]', inputs.build_type)) }}
      runs-on: ${{ matrix.env.os }}
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.tests_repository || github.repository }}
              ref: ${{ inputs.tests_ref }}

         - name: Configure
           working-directory: ${{ inputs.project_directory }}
           run: >
              cmake -S . -B build -G "${{ matrix.env.version }}"
              -DMABOROUTU_GIT_REPOSITORY="${{ inputs.library_repository || vars.MABOROUTU_GIT_REPOSITORY || 'https://github.com/Eigen-0x41/maboroutu.git' }}"
              -DMABOROUTU_GIT_TAG="${{ inputs.library_ref || vars.MABOROUTU_GIT_TAG || 'main' }}"
              -DMABOROUTU_APPKIT_GIT_REPOSITORY="${{ inputs.appkit_repository || vars.MABOROUTU_APPKIT_GIT_REPOSITORY || 'https://github.com/Eigen-0x41/maboroutu-appkit.git' }}"
              -DMABOROUTU_APPKIT_GIT_TAG="${{ inputs.appkit_ref || vars.MABOROUTU_APPKIT_GIT_TAG || 'main' }}"

         - name: Build
           working-directory: ${{ inputs.project_directory }}
           run: cmake --build build --config ${{ matrix.build_type }}

         - name: Test
           working-directory: ${{ inputs.project_directory }}/build
           run: ctest -C ${{ matrix.build_type }} --output-on-failure
