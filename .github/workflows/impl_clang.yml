name: maboroutu GTest verification implementation

on:
   workflow_call:
      inputs:
         compiler:
            required: true
            type: string

         project_directory:
            required: true
            type: string

         build_type:
            required: true
            type: string

         library_repository:
            required: false
            type: string
            default: ""

         library_ref:
            required: false
            type: string
            default: ""

         appkit_repository:
            required: false
            type: string
            default: ""

         appkit_ref:
            required: false
            type: string
            default: ""

         # 本体リポジトリ側のワークフローから呼び出す場合に指定する。
         # reusable workflowの actions/checkout は既定で呼び出し元
         # （本体リポジトリ）を取得するため、テスト側を明示する。
         tests_repository:
            required: false
            type: string
            default: ""

         tests_ref:
            required: false
            type: string
            default: ""

jobs:
   test:
      strategy:
         fail-fast: false
         matrix:
            os: [ubuntu-24.04]
            clang: [18, 19]
            build_type: ${{ fromJSON(inputs.build_type == 'Both' && '["Debug", "Release"]' || format('["{0}"]', inputs.build_type)) }}
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
           with:
              repository: ${{ inputs.tests_repository || github.repository }}
              ref: ${{ inputs.tests_ref }}

         - name: Install Clang ${{ matrix.clang }} + libc++ + Ninja
           run: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends \
                clang-${{ matrix.clang }} clang-tools-${{ matrix.clang }} \
                libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev \
                ninja-build

         - name: Install a CMake new enough to know cxx_std_23 for this compiler
           run: pipx install "cmake>=3.31" --force

         - name: Configure
           working-directory: ${{ inputs.project_directory }}
           run: >
              cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
              -DCMAKE_C_COMPILER=clang-${{ matrix.clang }}
              -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}
              -DCMAKE_CXX_FLAGS=-stdlib=libc++
              -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
              -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-${{ matrix.clang }}
              -DMABOROUTU_GIT_REPOSITORY="${{ inputs.library_repository || vars.MABOROUTU_GIT_REPOSITORY || 'https://github.com/Eigen-0x41/maboroutu.git' }}"
              -DMABOROUTU_GIT_TAG="${{ inputs.library_ref || vars.MABOROUTU_GIT_TAG || 'main' }}"
              -DMABOROUTU_APPKIT_GIT_REPOSITORY="${{ inputs.appkit_repository || vars.MABOROUTU_APPKIT_GIT_REPOSITORY || 'https://github.com/Eigen-0x41/maboroutu-appkit.git' }}"
              -DMABOROUTU_APPKIT_GIT_TAG="${{ inputs.appkit_ref || vars.MABOROUTU_APPKIT_GIT_TAG || 'main' }}"

         - name: Build
           working-directory: ${{ inputs.project_directory }}
           run: cmake --build build

         - name: Test
           working-directory: ${{ inputs.project_directory }}/build
           run: ctest --output-on-failure
